# 事件流水目录（重启后按此目录下 events.journal 重放）
matching.journal-dir=data/journal
# 单账户单标的在簿敞口上限（单位：分；10000000 = 10 万元）
matching.exposure-limit=10000000
# 市价单保护价 = 最近价 * num / den（110/100 = 允许上浮 10% 预占）
matching.market-protect-num=110
matching.market-protect-den=100
# 注册标的
matching.symbols[0]=600000
matching.symbols[1]=BTCUSDT
# 进程内模拟行情定时推送（单测中关闭，改为显式注入行情）
matching.feed-enabled=false
matching.feed-interval-ms=1000

spring.jackson.default-property-inclusion=non_null
