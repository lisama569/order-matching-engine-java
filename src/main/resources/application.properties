# 撮合服务本地配置
matching.tick-size=1
matching.lot-size=1
# 单账户单标的敞口上限（现金占用与卖出名义金额合并计量）
matching.default-exposure-limit=1000000
# 命令流水（WAL）文件；删除该文件即清空所有命令历史
matching.journal-path=data/journal.jsonl
matching.replay-on-startup=true
# 进程内模拟行情默认关闭，由测试/接口推送行情
matching.auto-market-feed=false
matching.auto-feed-interval-millis=2000

# 演示标的与初始行情价
matching.symbols.AAPL=100
matching.symbols.MSFT=200

# 演示账户初始现金
matching.accounts.alice=500000
matching.accounts.bob=500000

# 演示初始持仓
matching.positions[0].account=alice
matching.positions[0].symbol=AAPL
matching.positions[0].qty=1000
matching.positions[1].account=bob
matching.positions[1].symbol=MSFT
matching.positions[1].qty=1000
